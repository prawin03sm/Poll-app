<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VoteSpace{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav><a class="brand" href="{{ url_for('index') }}">Vote<span>Space</span></a><div>{% if session.admin_id %}<a href="{{ url_for('admin_dashboard') }}">Dashboard</a><a href="{{ url_for('admin_logout') }}">Sign out</a>{% else %}<a href="{{ url_for('admin_login') }}">Admin</a>{% endif %}</div></nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Made for better decisions · VoteSpace</footer>
</body>
</html>
