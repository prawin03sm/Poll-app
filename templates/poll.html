{% extends 'base.html' %}{% block title %}Vote · VoteSpace{% endblock %}{% block content %}
<div class="center-card"><a class="back" href="{{ url_for('index') }}">← All polls</a><p class="eyebrow">MAKE YOUR CHOICE</p><h1>{{ question.question }}</h1><form method="post" action="{{ url_for('vote', question_id=question.id) }}">{% for choice in choices %}<label class="choice"><input type="radio" name="choice_id" value="{{ choice.id }}"><span>{{ choice.choice_text }}</span><i></i></label>{% endfor %}<button class="button wide" type="submit">Submit vote</button></form><a class="results-link" href="{{ url_for('results', question_id=question.id) }}">Skip to results</a></div>
{% endblock %}
