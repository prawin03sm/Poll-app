name: Python CI - Build and Test

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build application
        run: |
          python -m compileall .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-build
          path: |
            app.py
            templates/
            static/
            requirements.txt


  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-build
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v
